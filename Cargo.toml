[package]
name = "xyk-arbitrage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_norway = "0.9.42"
solana-pubkey = "4.2.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = { version = "0.1.44", features = ["valuable"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono", "json", "valuable"] }
valuable = { version = "0.1.1", features = ["derive"] }
yellowstone-grpc-client = "13.2.0"
yellowstone-grpc-proto = "12.5.0"
futures = "0.3.34"
solana-sdk = "4.0.1"
solana-client = "4.2.2"
dashmap = "6.2.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
strip = "symbols"
