[package]
name        = "assert-min-profit"
version     = "0.1.0"
description = "On-chain min-balance check: reverts the entire transaction if the bot's USDC balance is below threshold. The last line of defence against unprofitable bundles per INSTRUCTIONS.md Phase 3."
edition     = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name       = "assert_min_profit"

[features]
default        = []
cpi            = ["no-entrypoint"]
no-entrypoint  = []
no-idl         = []
no-log-ix-name = []
# Anchor 0.30 requires this to enable the IDL build.
idl-build      = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30"
anchor-spl  = "0.30"

[dev-dependencies]
# Integration tests use solana-program-test for a pure-Rust harness — no
# TypeScript or `anchor test` invocation needed once `cargo build-sbf` has
# produced the program ELF.
solana-program-test = "2"
solana-sdk          = "2"
solana-program      = "2"
spl-token           = "6"
spl-associated-token-account = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
