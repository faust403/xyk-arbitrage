# Scout pool list — comprehensive SOL/USDC + USDC/USDT coverage
# Sources: GeckoTerminal API (Solana network), verified May 2026.
# Sorted within each section by 24h volume descending.
#
# Coverage philosophy:
#   * Every supported DEX (Raydium AMM v4, Raydium CLMM, Orca Whirlpool,
#     Meteora DLMM) gets all its top SOL/USDC pools.
#   * Direction (SOL→USDC vs USDC→SOL) is handled automatically — Whirlpool/
#     CLMM/DLMM all order mints by raw byte order on chain (SOL=0x06 < USDC=0xc6
#     so token_a/0/x = SOL always); the route builder adds every pool to BOTH
#     directions of the adjacency graph, so cycles in either direction are found.
#   * USDC/USDT and other stable pairs included as "bridge" hops for 3-cycles.
#
# Excluded (not supported by current parsers):
#   * Humidifi pools (different program) — Phase 12+ work
#   * PancakeSwap V3 on Solana — different program
#   * Raydium Stable Swap (`5quBt...` program, e.g. pool 2EXiumdi...) —
#     different protocol from AMM v4 (Curve-style, not constant-product)
#
# Token mints (verified):
#   USDC = EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
#   USDT = Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB
