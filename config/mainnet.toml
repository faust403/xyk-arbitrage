# Mainnet mode: live capital. Phase 11.4 starts here, gated by explicit
# operator approval in Telegram. Every value below is validated strictly —
# placeholders or empty wallet/program-id are rejected at boot.

mode = "mainnet"

[rpc]
helius_api_key = "${HELIUS_API_KEY}"
http_endpoint  = "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
wss_endpoint   = "wss://atlas-mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
# Optional: set when on Helius Business plan for LaserStream gRPC access.
# Leave commented out for Developer plan.
# laserstream_endpoint = "${HELIUS_LASERSTREAM_URL}"

[jito]
block_engine_url     = "https://frankfurt.mainnet.block-engine.jito.wtf"
default_tip_lamports = 10000

[wallet]
keypair_json      = "${SOLANA_KEYPAIR_JSON}"
assert_program_id = "${ASSERT_PROGRAM_ID}"

[solend]
lending_market    = "4UpD2fh7xH3VP9QQaXtsS1YY3bxzWhtfpks7FatyKvdY"
usdc_reserve      = "BgxfHJDzm44T7XG68MYKx7YisTjZu73tVovyZSjJMpmw"
flash_loan_fee_bps = 9

[telegram]
bot_token        = "${TELEGRAM_BOT_TOKEN}"
operator_chat_id = 429136864

[risk]
# Initial mainnet caps per INSTRUCTIONS.md Phase 11.4:
# * MAX_FLASHLOAN_AMOUNT_USDC = 100_000_000  (100 USDC, 6 decimals)
# * MIN_PROFIT_LAMPORTS       = 200_000      (~$0.03 — very conservative)
# Operator raises via /tune after the 30-day mainnet-small phase clears.
min_profit_lamports           = 200000
max_flashloan_amount_usdc     = 100000000
max_concurrent_opportunities  = 4

[dexes]
enabled = [
    "raydium-amm-v4",
    "raydium-clmm",
    "orca-whirlpool",
    "meteora-dlmm",
    "lifinity-v2",
]

