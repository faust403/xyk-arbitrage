[package]
name        = "arb-scout"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
publish     = { workspace = true }
description = "Phase −1 paper-trading scout: monitors Solana DEX pools via Helius Enhanced WebSockets, computes hypothetical arbitrage, logs JSONL. Submits NOTHING."

[lib]
name = "arb_scout"
path = "src/lib.rs"

[[bin]]
name = "arb-scout"
path = "src/main.rs"

[[bin]]
name = "scout-report"
path = "src/bin/scout-report.rs"

[[bin]]
name = "marginfi-usdt-vault"
path = "src/bin/marginfi-usdt-vault.rs"

[[bin]]
name = "swap-once"
path = "src/bin/swap-once.rs"

[dependencies]
arb-core            = { path = "../arb-core" }
arb-dex-raydium     = { path = "../arb-dex-raydium" }
arb-dex-orca        = { path = "../arb-dex-orca" }
arb-stream          = { path = "../arb-stream" }
arb-pathfinder      = { path = "../arb-pathfinder" }
arb-jito            = { path = "../arb-jito" }
arb-telemetry       = { path = "../arb-telemetry" }
arb-dex-meteora     = { path = "../arb-dex-meteora" }
arb-dex-lifinity    = { path = "../arb-dex-lifinity" }
arb-dex-obric       = { path = "../arb-dex-obric" }
arb-flashloan       = { path = "../arb-flashloan" }

solana-program      = { workspace = true }

tokio               = { workspace = true }
tokio-tungstenite   = { workspace = true }
futures             = { workspace = true }
async-trait         = { workspace = true }

serde               = { workspace = true }
serde_json          = { workspace = true }
toml                = { workspace = true }
borsh               = { workspace = true }
bytemuck            = { workspace = true }

anyhow              = { workspace = true }
thiserror           = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }

dashmap             = { workspace = true }

reqwest             = { workspace = true }
dotenvy             = { workspace = true }
chrono              = { workspace = true }

base64              = { workspace = true }
teloxide            = { workspace = true }
ed25519-dalek       = { workspace = true }
bs58                = { workspace = true }
flate2              = "1"
rand                = "0.8"

[features]
# Forward `laserstream` to arb-stream so a `--features laserstream` build
# on the scout crate enables the gRPC backend.
default       = []
laserstream   = ["arb-stream/laserstream"]
# Native Rust subscriber to Jito's ShredStream Proxy (Phase D — replaces
# the Python `unified_shred_tee.py` file-bridge with in-process gRPC).
shredstream   = ["arb-stream/shredstream"]

[dev-dependencies]
proptest            = { workspace = true }
tempfile            = "3"
